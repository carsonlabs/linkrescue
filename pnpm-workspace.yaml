packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 reads dependency-resolution settings from this file, not package.json.
# Keep the audited transitive-dependency floor active for local and CI installs.
overrides:
  undici: '>=7.24.0'
  socket.io-parser: '>=4.2.6'
  serialize-javascript: '>=7.0.3'
  'editorconfig>minimatch': '>=9.0.7'
  fast-xml-parser: '>=5.5.7'
  prismjs: '>=1.30.0'
  caniuse-lite: '>=1.0.30001792'
  baseline-browser-mapping: '>=2.11.15'
